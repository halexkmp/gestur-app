hooks:
  before_specify:
    - extension: "api-contract-guard"
      command: "api-contract-check"
      optional: false
      enabled: true
      description: >-
        Scans specs/api/*.md (the sole source of truth for backend behavior)
        and surfaces the endpoints, shapes, and known quirks relevant to the
        feature being specified, before spec.md is written.
      prompt: >-
        Run the api-contract-check skill: scan specs/api/*.md for anything
        relevant to this feature, and report findings.
